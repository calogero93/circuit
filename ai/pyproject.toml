[project]
name = "ai"
version = "0.1.0"
description = "Tutor LangGraph di KirchForge, con LLM locale e tool live"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115,<1",
    "langchain-openai>=0.3,<2",
    "langgraph>=1,<2",
    "langgraph-checkpoint-postgres>=3,<4",
    "psycopg[binary,pool]>=3.2,<4",
    "networkx>=3,<4",
    "pydantic>=2,<3",
    "python-dotenv>=1,<2",
    "uvicorn>=0.30,<1",
    "websockets>=14,<17",
]

[project.optional-dependencies]
anthropic = ["langchain-anthropic>=0.3,<2"]
rag = [
    "beautifulsoup4>=4.12",
    "langchain-text-splitters>=0.3,<2",
    "markdown>=3.7",
    "qdrant-client>=1.12,<2",
    "sentence-transformers>=3,<6",
]
dev = ["httpx>=0.27,<1"]
nli = ["onnxruntime>=1.20,<2", "tokenizers>=0.21,<1", "httpx>=0.27,<1"]
